[project]
name = "aurago-needle3"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cactus-needle @ git+https://github.com/cactus-compute/needle@42bf1f2d0a7784b0d4d1ec94bb5ade425cf9a67c",
  "numpy>=2.5.4,<3",
  "sentencepiece>=0.2.2,<0.3",
  "huggingface-hub>=2.2.0,<3",
  "safetensors>=0.8.0,<1",
  "lingua-language-detector>=2.2.0,<3",
]

[dependency-groups]
retrieval = ["sentence-transformers>=6.1,<7"]
train = ["jax[cuda12]>=0.11.2; sys_platform == 'linux'", "flax>=0.12.10", "optax>=0.2.8"]
cpu-train = ["jax>=0.6", "flax>=0.12.10", "optax>=0.2.8"]
transfer = ["boto3>=1.43.113,<2"]

[tool.uv]
package = false
conflicts = [[{group = "train"}, {group = "cpu-train"}]]
